<!DOCTYPE html>

    <title>IntelliTrac SalesBot – Redirect</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #0A2540 0%, #103A63 60%, #1a4a7a 100%);

        }
        .container { text-align: center; }
        h2 { margin-bottom: 0.5rem; }
        a { color: #F26522; font-weight: 600; text-decoration: none; }

            width: 40px; height: 40px; margin: 20px auto;

            border-top-color: #F26522;

            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        <h2>🛰️ IntelliTrac SalesBot</h2>
